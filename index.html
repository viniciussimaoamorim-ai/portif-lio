<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Adoção de Animais</title>
</head>
<body>

<h1>Adoção de Animais</h1>
<p>Encontre seu amigo de quatro patas!</p>

<h2>Animais Disponíveis</h2>
<div>
    <h3>Rex</h3>
    <p>2 anos - Labrador</p>
    <img src="https://place-puppy.com/150x150" alt="Cachorro">
</div>
<div>
    <h3>Luna</h3>
    <p>1 ano - Siamês</p>
    <img src="https://placekitten.com/150/150" alt="Gato">
</div>

<h2>Contato</h2>
<form>
    <input type="text" placeholder="Nome" required><br>
    <input type="email" placeholder="Email" required><br>
    <textarea placeholder="Mensagem" rows="3" required></textarea><br>
    <button type="submit">Enviar</button>
</form>

</body>
</html>
